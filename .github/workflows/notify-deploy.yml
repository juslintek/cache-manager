name: Notify deploy

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_TRIGGER_PAT }}
          repository: Zelkai/gratis-deploy
          event-type: plugin-updated
          client-payload: '{"plugin": "${{ github.event.repository.name }}", "sha": "${{ github.sha }}"}'

