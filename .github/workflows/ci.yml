name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist
          fi

      - name: Lint PHP
        run: find . -path ./.git -prune -o -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate plugin header and readme.txt
        run: |
          php -r '
          $main = "gratis-cache.php";
          if (!is_file($main)) { fwrite(STDERR, "Missing main file: $main\n"); exit(1); }
          $head = substr((string) file_get_contents($main), 0, 8192);
          foreach (["Plugin Name:", "Version:", "Requires PHP:", "License:"] as $req) {
              if (stripos($head, $req) === false) { fwrite(STDERR, "Missing header $req in $main\n"); exit(1); }
          }
          preg_match("/Version:\s*([^\r\n]+)/i", $head, $mv);
          $ver = trim($mv[1] ?? "");
          if (!is_file("readme.txt")) { fwrite(STDERR, "Missing readme.txt\n"); exit(1); }
          $rt = (string) file_get_contents("readme.txt");
          preg_match("/Stable tag:\s*([^\r\n]+)/i", $rt, $ms);
          $stag = trim($ms[1] ?? "");
          if ($ver === "" || $ver !== $stag) { fwrite(STDERR, "Version ($ver) != Stable tag ($stag)\n"); exit(1); }
          echo "Header and readme.txt valid (gratis-cache v$ver)\n";
          '

      - name: Run tests
        if: hashFiles('tests/') != ''
        run: vendor/bin/phpunit
